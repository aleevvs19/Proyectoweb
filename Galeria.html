<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotorStore - Galería</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h2 style="color: white;">MotorStore</h2>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="Autos.html">Autos</a></li>
                <li><a href="Motos.html">Motos</a></li>
                <li><a href="Productos.html">Productos</a></li>
                <li><a href="Galeria.html">Galeria</a></li>
                <li><a href="Servicios.html">Servicios</a></li>
            </ul>
            <button onclick="alternarModo()">Modo Oscuro</button>
        </nav>
    </header>

    <main>
        <h1 style="text-align: center;">Galería Fotográfica</h1>
        <p style="text-align: center; margin-bottom: 20px;">Explora la flota completa de superdeportivos y motocicletas disponibles.</p>

        <section class="grid-catalogo">
            <article class="card">
                <img src="img/amg_gt.jpg" alt="Mercedes-AMG GT">
                <h3 style="margin-top: 10px;">Mercedes-AMG GT</h3>
            </article>

            <article class="card">
                <img src="img/m4.jpg" alt="BMW M4 Competition">
                <h3 style="margin-top: 10px;">BMW M4 Competition</h3>
            </article>

            <article class="card">
                <img src="img/urus.jpg" alt="Lamborghini Urus">
                <h3 style="margin-top: 10px;">Lamborghini Urus</h3>
            </article>

            <article class="card">
                <img src="img/r15.jpg" alt="Yamaha YZF-R15">
                <h3 style="margin-top: 10px;">Yamaha YZF-R15</h3>
            </article>

            <article class="card">
                <img src="img/ktm.jpg" alt="KTM Duke 390">
                <h3 style="margin-top: 10px;">KTM Duke 390</h3>
            </article>

            <article class="card">
                <img src="img/ninja400.jpg" alt="Kawasaki Ninja 400">
                <h3 style="margin-top: 10px;">Kawasaki Ninja 400</h3>
            </article>
        </section>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
